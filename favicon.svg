<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#0D9488" />
    </linearGradient>
    <linearGradient id="ring-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="2" />
  
  <!-- Subtle circuit ring -->
  <circle cx="32" cy="32" r="24" fill="none" stroke="url(#ring-glow)" stroke-width="1.5" stroke-dasharray="6 3" />
  
  <!-- Circuit node dots -->
  <circle cx="32" cy="8" r="2" fill="#38BDF8" filter="url(#glow)" />
  <circle cx="56" cy="32" r="2" fill="#06B6D4" />
  <circle cx="32" cy="56" r="2" fill="#10B981" />
  <circle cx="8" cy="32" r="2" fill="#06B6D4" />

  <!-- Monogram 'VS' (Varish Shukla) stylized as connected circuit traces -->
  <!-- V path -->
  <path d="M19 22 L27 42 L31 42 L37 27" fill="none" stroke="url(#accent-cyan)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- S path -->
  <path d="M45 23 C39 20, 33 24, 34 29 C35 34, 46 32, 45 39 C44 44, 35 44, 31 41" fill="none" stroke="#F8FAFC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Pulse node on V point -->
  <circle cx="29" cy="42" r="2.5" fill="#38BDF8" filter="url(#glow)" />
</svg>
